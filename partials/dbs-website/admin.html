<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Djabusabi static admin dashboard demo with product and user management."
    >
    <title>Djabusabi - Administração</title>
    <link rel="icon" href="../dbs_php/assets/logos/logo_vigo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body data-page="admin">
<div class="backgroundOrbs" aria-hidden="true">
    <span class="orb orbA"></span>
    <span class="orb orbB"></span>
    <span class="orb orbC"></span>
</div>

<div class="siteShell">
    <header id="siteHeader"></header>

    <main class="pageWrap">
        <section class="pageIntro">
            <div>
                <span class="eyebrow">Admin demo</span>
                <h1>Painel de administração estático para produtos e utilizadores.</h1>
                <p class="pageLead">
                    Em vez de formulários PHP e CRUD no servidor, esta versão usa dados locais editáveis e proteção por
                    permissões simuladas.
                </p>
            </div>
            <div class="introBadgeGroup">
                <span class="pillTag">Produtos</span>
                <span class="pillTag">Utilizadores</span>
                <span class="pillTag">Demo state</span>
            </div>
        </section>

        <section id="adminRoot" class="adminRoot"></section>
    </main>

    <footer id="siteFooter"></footer>
</div>

<div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
