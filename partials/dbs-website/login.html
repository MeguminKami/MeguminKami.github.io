<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Djabusabi — Iniciar Sessão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300;400;500;700;800&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/body.css">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/footer.css">
  <link rel="stylesheet" href="styles/containers.css">
  <link rel="stylesheet" href="styles/messages.css">
  <link rel="stylesheet" href="styles/buttons.css">
  <link rel="stylesheet" href="styles/forms.css">
  <link rel="stylesheet" href="styles/details.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <div class="body-content">
    <div class="login-signup-page-container">
      <div class="home-icon-container"><a href="index.html"><img src="assets/logos/logo_branco.png" alt="Djabusabi"></a></div>
      <div class="login-signup-side-container">
        <section class="login-signup-container">
          <h1>Entra com a tua conta Djabusabi!</h1>
          <div class="login-signup-form">
            <form>
              <input type="text" name="logintext" placeholder="E-Mail ou Nome de Utilizador" required>
              <input type="password" name="password" placeholder="Password" required>
              <p class="error-message">Mockup visual: autenticação desativada nesta versão estática.</p>
              <button class="login-signup-button" type="submit">Iniciar Sessão</button>
            </form>
          </div>
        </section>
        <section class="login-signup-container">
          <h1>Ainda não és um membro dos Djabusabi?</h1>
          <h2>Regista-te e entra na estética da marca.</h2>
          <a href="signup.html" class="login-signup-button">Criar Conta</a>
        </section>
      </div>
    </div>
  </div>
  <footer class="footer">
    <div class="footer-container">
      <div class="footer-item left"><p>&copy; 2026 Djabusabi. Todos os direitos reservados.</p></div>
      <div class="footer-item center"><a href="index.html">Home</a><a href="store.html">Loja</a></div>
      <div class="footer-item right"><a href="signup.html">Criar Conta</a></div>
    </div>
  </footer>
</body>
</html>
